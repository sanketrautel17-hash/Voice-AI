name: Build and Push Docker Image

# This tells GitHub to run this script whenever you push code to the "main" branch
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub downloads your project code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: GitHub logs securely into Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: GitHub builds the Dockerfile and pushes it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: sanketrautel45/voice_ai:latest
